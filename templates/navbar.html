{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Mobiles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background-color: #033756;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            color: white;
            position: relative;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
        }
        .search-bar {
            flex-grow: 1;
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 8px;
            padding: 5px;
            max-width: 600px;
        }
        .search-bar input {
            flex-grow: 1;
            border: none;
            padding: 10px;
            font-size: 16px;
            outline: none;
            border-radius: 8px 0 0 8px;
        }
        .search-bar button {
            background-color: #febd69;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 0 8px 8px 0;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a {
          color:black;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background: black;
            color:white;
        }
        .hamburger {
            display: none;
            font-size: 24px;
            cursor: pointer;
        }
        .nav-menu {
            display: none;
            flex-direction: column;
            width: 100%;
            text-align: center;
            background-color: #37475a;
            padding: 10px;
        }
        .nav-menu.active {
            display: flex;
        }
        .fixed-links {
            display: flex;
            gap: 10px;
            color:white;gap:10px;
        }
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }
            .search-bar {
                width: 100%;
                margin-top: 10px;
            }
            .hamburger {
                display: block;
            }
            .fixed-links {
    position: absolute;
    top: 0;
    right: 0;
    display: flex;
    justify-content: flex-end;
    background: #232f3e;
    padding: 10px;
    width: auto;
}

                
           
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                color:black;
            }
            .nav-links.active {
                display: flex;
            }
        }
    </style>
    <script>
        function toggleMenu() {
            const navLinks = document.querySelector('.nav-links');
            navLinks.classList.toggle('active');
        }
    </script>
</head>
<body>
    <nav class="navbar" >  
     
        <div class="logo"> <img src="{% static 'images/global_logo.jpeg' %}" width="30" height="30"></a>&nbsp;Global Mobiles</div>
        <form method="GET" action="{% url 'search_products' %}">
          <div class="search-bar">
              <input type="text" style="width:325px;height: 10px;" name="q" placeholder="Search Products" value="{{ query }}">
              <button type="submit"><i class="fa fa-search"></i></button>
          </div>
      </form>
      
        <script src="https://kit.fontawesome.com/YOUR_FA_KIT.js" crossorigin="anonymous"></script>
   
    <div class="fixed-links">
      {% if not request.session.userid %}
    <a style="  color:white;" href="{% url 'Login' %}?next={{ request.path }}"  ><i class="fas fa-user"></i>&nbspLogin</a>
          {% else %}
    <a style="  color:white;" href="/logout-user" >Logout</a>

      {% endif %}
    <!-- <a href="#"  style="  color:white;"><i class="fas fa-box"></i> Orders</a> -->
    <a href="/cart" style="  color:white;"><i class="fas fa-shopping-cart"></i> Cart</a>
  </div>
  
        <div class="hamburger" onclick="toggleMenu()">
            <i class="fa fa-bars"></i>
        </div>
    </nav>

    <div class="nav-links">
      <a href="/">Home</a>
        <a href="/products" >Our Products</a>
        <a href="/services">Our Services</a>
        <a href="/contact">Contact Us</a>
   
    </div>
</body>
</html>
